<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../Css/login.css">

    <title>Clinica Login</title>


</head>



<script>
async function fazerLogin(){

    const email = document.getElementById("emailLogin").value;
    const senha = document.getElementById("senhaLogin").value;

    const resposta = await fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            senha: senha
        })
    });

    const dados = await resposta.json();

    if(resposta.ok){
        localStorage.setItem("id_paciente", dados.id_paciente);
        localStorage.setItem("nome_paciente", dados.nome);

        window.location.href = "hea.html";
    } else {
        alert(dados.erro);
    }
}
</script>






<body>
    
    <div class="principal">

        <main class="container-login"></main>
        <form>
            
            <h1>Faça seu Login</h1>
            
            <div class="input-box">
                <input id="emailLogin" placeholder="Usuário" type="email">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input id="senhaLogin" placeholder="Senha" type="password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="remember">
                <label>    
                    <input type="checkbox">
                    Lembrar a senha 
                </label>
                <a href="#">Esqueci a senha</a>
            </div>

            <button type="button" class="login" onclick="fazerLogin()">Login</button>

            <div class="register-link">
                <p>Não tem uma conta <a href="cadastro.html">Cadastre-se</a></p>
            </div>

            <div class="back-page">
                <p>Voltar para <a href="hea.html">Página Inicial</a></p> 
            </div>

        </form>

    </div>
    


</body>
</html>
